# 发版流水线：推一个 v* 标签，自动出 Windows 安装包并上传到 Releases。
#
# macOS 不在这里出包，要在本机跑 `npm run release:mac`。
#
# 原因是签名。macOS 包现在用 Developer ID 正式签名并公证，私钥和公证凭据都在
# 本机钥匙串里，没有放进 GitHub Secrets。CI 上没有证书，一旦让它跑 --mac，
# electron-builder 会因为找不到 `identity` 指定的证书直接失败。
#
# Windows 的包也必须在 Windows 上出：NSIS 卸载器要真正执行一遍 WriteUninstaller
# 才能生成，在 macOS 上没有 Wine 时会静默失败，产出「能装不能卸」的包（实测踩过）。
#
# 上传走 electron-builder 自己的 publish，而不是手工传附件：它会同时生成
# latest.yml / latest-mac.yml，壳自身的在线升级（electron-updater）靠这两个
# 文件发现新版本；手工传附件会漏掉它们，自动更新就永远发现不了新版。
# 本机那条路（release:mac）同样是调 electron-builder 的 publish，不是手工上传。
#
# Release 先落成草稿（electron-builder.yml 里 releaseType: draft），
# 等 Windows 与 macOS 两边的产物都传齐了再由人工确认发布。
name: release

on:
  push:
    tags: ['v*']
  # 不推标签也能手动试跑一次完整流程
  workflow_dispatch:

# 需要写 Releases 的权限；GITHUB_TOKEN 默认只读
permissions:
  contents: write

jobs:
  # 先做一轮快速校验，省得两个平台各跑十几分钟才发现类型错了
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 构建主进程与渲染层
        run: npm run build
      - name: 核对标签与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "标签 v$TAG 与 package.json 的 $PKG 不一致；改版本号后重新打标签" >&2
            exit 1
          fi
          echo "版本一致：$PKG"

  # 先把草稿 Release 建出来，再让两个平台往同一个里传。
  # 否则 mac 与 windows 并行时都发现「没有对应 Release」，会各建一个草稿，
  # 产物被劈成两半（实测踩过：一条只有 dmg，另一条只有 exe）。
  prepare-release:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"
          else TAG="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "目标 Release：$TAG"
      - name: 确保草稿 Release 存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "已存在，复用"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --notes "由 CI 自动构建，确认无误后再点发布。"
          fi

  build:
    needs: prepare-release
    strategy:
      # 一个平台失败不影响另一个继续，便于单独重跑。
      # 现在矩阵里只剩 Windows，macOS 见文件顶部说明——留着矩阵结构是为了
      # 哪天证书进了 Secrets 能直接把 macos-14 那条加回来。
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (x64)
            dist: npx electron-builder --win nsis --x64 --publish always
    runs-on: ${{ matrix.os }}
    name: 打包 ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 内置的官方 Node 运行时约 200MB，缓存掉能省大量时间；
      # 缓存键带上下载脚本，脚本改了（比如换 Node 大版本）自动失效。
      - name: 缓存内置 Node 运行时
        uses: actions/cache@v4
        with:
          path: vendor/node
          key: ${{ runner.os }}-vendor-node-${{ hashFiles('scripts/fetch-node.mjs') }}

      - name: 准备内置 Node 运行时
        run: npm run prepare:node

      # 随包分发的 pnpm：不带它，用户机器上首次装插件要联网走 corepack 下载
      - name: 准备内置 pnpm
        run: npm run prepare:pnpm

      # 种子是当前最新版 Harness，每次发版都重新拉，不缓存
      - name: 准备种子 Harness
        run: npm run prepare:seed

      - name: 构建
        run: npm run build

      - name: 打包并上传到 Releases
        run: ${{ matrix.dist }}
        env:
          # electron-builder 用它创建草稿 Release 并上传产物
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 校验脚本原本只挂在 npm run dist:win 上，而 CI 是直接调 electron-builder，
      # 于是它在真正出包的路径上一次都没跑过——内置资源掉了也不会被拦住
      - name: 校验 Windows 包内资源完整
        if: runner.os == 'Windows'
        run: node scripts/verify-win-package.mjs

      # 即使上传 Release 失败，也留一份产物便于排查
      - name: 留存产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
          if-no-files-found: warn
          retention-days: 14
