# 日常检查：每次推送与 PR 都跑，只做类型检查与构建，不打包。
# 打包发版走 release.yml（推 v* 标签触发）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 构建
        run: npm run build
      - name: 构建皮肤插件
        working-directory: plugins/dsh-plugin-skin-studio
        run: |
          npm ci
          npm run build
