# 双平台安装包构建：手动触发或推 v* 标签时运行。
# 要接壳自身的在线升级（electron-updater），在 electron-builder.yml 配好 publish 后，
# 把下面两处 dist 命令换成 `npx electron-builder --publish always ...` 并提供 GH_TOKEN。
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 准备内置 Node 运行时
        run: npm run prepare:node
      - name: 准备种子 Harness
        run: npm run prepare:seed
      - name: 打包 DMG（未签名；配好证书后按 README 开启签名公证）
        run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/*.dmg
            release/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 准备内置 Node 运行时
        run: npm run prepare:node
      - name: 准备种子 Harness（原生安装，含安装脚本）
        run: npm run prepare:seed
      - name: 打包 NSIS 安装包
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: release/*.exe
