# 打包配置：macOS（arm64）+ Windows 11（x64）。
# macOS 用 Developer ID 正式签名并公证；Windows 代码签名见 README。
appId: com.moon.dsh-desktop
productName: DSH Desktop
directories:
  output: release

files:
  - dist/**
  - package.json

# 桥接脚本要留在 asar 外面。它由内置 Node 以独立进程执行，而普通 Node 读不了
# asar 归档（asar 支持是 Electron 给 fs 打的补丁，子进程没有），留在里面会
# 报 Cannot find module 然后无限退避重启。依赖已在构建时全部内联，解包这一个
# 目录就够。取路径见 src/main/bridge-service.ts 的 bridgeScriptPath。
asarUnpack:
  - dist/bridge/**

npmRebuild: false

# afterPack 里的 ad-hoc 签名只在拿不到 Developer ID 证书时兜底；有证书时
# electron-builder 自己签，那个钩子会自行跳过，见脚本内的判断。
afterPack: scripts/adhoc-sign.mjs

mac:
  category: public.app-category.developer-tools
  # 用 Developer ID Application 证书签名。留空表示让 electron-builder 自己从
  # 钥匙串里挑——本机只有一张 Developer ID，不会挑错；CI 上由 CSC_LINK 提供。
  identity: zhicheng hu (5J5U2Y44US)
  # 公证的前提。开启后 V8 生成机器码、加载内置 Node/pnpm 都需要豁免，见 entitlements。
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 公证：把包传给苹果扫描并回贴票据（staple）。做完之后用户双击即开，
  # 既不用 xattr 清隔离标记，也不会再出现「未验证的开发者」。
  #
  # 这里只能写布尔值（26.x 起如此，写成对象会被 schema 拒绝）；凭据走环境变量。
  # 本机用钥匙串 profile：APPLE_KEYCHAIN_PROFILE=dsh-notary，见 npm 脚本
  # dist:mac:notarize。CI 上改用 App Store Connect API key 那三个变量。
  notarize: true
  # 只给 1024 的 PNG，.icns 由 electron-builder 自动派生
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  extraResources:
    # 随包分发的 pnpm。dsh 的插件安装命令是 pnpm 转发器，而 corepack 首次
    # 使用要联网下载真正的 pnpm——全新机器上因此一个插件都装不上。
    # 只带运行必需的部分，artifacts/ 是独立可执行版才用的原生二进制，已剔除。
    - from: vendor/pnpm
      to: pnpm
    # 随包分发的三个插件（插件管理 / 皮肤 / 远程控制）。
    # 侧栏那三个入口全靠它们提供，不打进来用户装完是空的。
    # 只带运行必需的三样，源码与 node_modules 不进包。
    - from: plugins
      to: plugins
      filter:
        - "dsh-plugin-*/lib/**"
        - "dsh-plugin-*/package.json"
        - "dsh-plugin-*/cordis.patch.yml"
    # 官方 Node.js 运行时（用户因此无需安装 Node）
    - from: vendor/node/darwin-arm64
      to: node
      filter:
        - "**/*"
        - "!include/**"
        - "!share/**"
        - "!lib/node_modules/npm/docs/**"
        - "!lib/node_modules/npm/man/**"
    # 种子版 Harness 运行时（首启解压，之后走应用内在线升级）
    - from: vendor/seed/darwin-arm64
      to: seed
    # 菜单栏图标（tray.ts 从 resourcesPath 读）。
    # 现在两个平台都用彩色 Logo，所以 trayIcon 这一对必须带上；模板图留着，
    # 想退回「跟随系统深浅色」的单色方案时不用重新打包资源。
    - from: resources/trayIcon.png
      to: trayIcon.png
    - from: resources/trayIcon@2x.png
      to: trayIcon@2x.png
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: resources/trayTemplate@2x.png
      to: trayTemplate@2x.png

win:
  # 同 mac：只给 1024 的 PNG，.ico 由 electron-builder 自动派生
  icon: build/icon.png
  # nsis 只能在 Windows（或装了 Wine 的机器）上构建，否则卸载器会是坏的，
  # scripts/check-win-build.mjs 会拦截；zip 为免安装版，任何平台都能出。
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  extraResources:
    # 随包分发的 pnpm。dsh 的插件安装命令是 pnpm 转发器，而 corepack 首次
    # 使用要联网下载真正的 pnpm——全新机器上因此一个插件都装不上。
    # 只带运行必需的部分，artifacts/ 是独立可执行版才用的原生二进制，已剔除。
    - from: vendor/pnpm
      to: pnpm
    # 随包分发的三个插件（插件管理 / 皮肤 / 远程控制）。
    # 侧栏那三个入口全靠它们提供，不打进来用户装完是空的。
    # 只带运行必需的三样，源码与 node_modules 不进包。
    - from: plugins
      to: plugins
      filter:
        - "dsh-plugin-*/lib/**"
        - "dsh-plugin-*/package.json"
        - "dsh-plugin-*/cordis.patch.yml"
    - from: vendor/node/win32-x64
      to: node
    # Windows 发行包的 npm 在根级 node_modules 下，electron-builder 会默认忽略
    # 根级 node_modules，单独一条规则直接拷到目标位置绕开该行为
    - from: vendor/node/win32-x64/node_modules/npm
      to: node/node_modules/npm
      filter:
        - "**/*"
        - "!docs/**"
        - "!man/**"
    # corepack 与 npm 一样位于根级 node_modules，也会被 electron-builder
    # 默认忽略；Harness 的插件命令依赖它提供 pnpm。
    - from: vendor/node/win32-x64/node_modules/corepack
      to: node/node_modules/corepack
      filter:
        - "**/*"
    - from: vendor/seed/win32-x64
      to: seed
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: resources/trayTemplate@2x.png
      to: trayTemplate@2x.png
    # Windows 通知区域使用彩色产品 Logo，不复用 macOS 的黑色模板图
    - from: resources/trayIcon.png
      to: trayIcon.png
    - from: resources/trayIcon@2x.png
      to: trayIcon@2x.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: DSH Desktop

# 发布源。CI 用 `electron-builder --publish always` 上传到 GitHub Releases，
# 同时生成 electron-updater 需要的 latest.yml / latest-mac.yml——壳自身的
# 在线升级就是靠这两个文件发现新版本的，所以不要改用手工上传附件的方式。
#
# releaseType: draft —— 先进草稿，人工确认后再点发布，避免 CI 一跑就对外可见。
publish:
  provider: github
  owner: huzhicheng
  repo: dsh-desktop
  releaseType: draft
