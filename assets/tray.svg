<!--
  菜单栏图标：单色鲸鱼剪影。
  不能直接用 assets/logo.png——那张插画在 16pt 菜单栏会糊成一团色块，
  而且 macOS 菜单栏要求「模板图」（纯黑 + 透明）才能自动适配深浅色。
  这里只取品牌里最容易辨认的那个元素：鲸鱼的身形、尾鳍和水柱。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g fill="#000">
    <!-- 身体 + 尾鳍连成一笔，保证小尺寸下不断开 -->
    <path d="M25 20c11 0 20 6.5 20 15 0 1.2-.2 2.4-.5 3.5l7.6-6.2c1.6-1.3 4-.1 3.9 2l-.6 12.4c-.1 2.1-2.6 3.1-4.1 1.6l-7.4-7.3C41 46.6 33.7 50 25 50 12.8 50 4 43.3 4 35s8.8-15 21-15z"/>
    <!-- 水柱：两滴，小尺寸下仍能看出是鲸鱼而不是鱼 -->
    <path d="M24 6.5c1.4 0 2.5 1.1 2.5 2.5S25.4 14 24 14s-2.5-1.6-2.5-3 1.1-4.5 2.5-4.5zM33 9.5c1.2 0 2.2 1 2.2 2.2s-1 3.8-2.2 3.8-2.2-1.4-2.2-2.6 1-3.4 2.2-3.4z"/>
  </g>
</svg>
